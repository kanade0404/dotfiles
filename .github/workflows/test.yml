name: test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  bun-test:
    name: bun test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      # package.json の "test" 経由で呼ぶ (bunfig.toml root と bunfig.scripts.toml root の
      # 2 config を両方回す。理由は bunfig.scripts.toml のコメント参照)。
      - run: bun run test

  typecheck:
    name: tsc --noEmit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit -p tsconfig.json

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run shellcheck
        run: |
          set -euo pipefail
          # 生成 skill コピー (rulesync で upstream から取得。著者管理外) は
          # 対象外にする。.markdownlint-cli2.jsonc の ignores と同じポリシー
          # (生成コピーは lint 対象外、source 側で担保する)。
          mapfile -d '' -t sh_files < <(
            find . \
              -path ./node_modules -prune -o \
              -path ./.git -prune -o \
              -path ./.claude/skills -prune -o \
              -path ./.agents/skills -prune -o \
              -path ./.opencode/skills -prune -o \
              -type f -name '*.sh' -print0
          )
          mapfile -d '' -t shebang_files < <(
            find . \
              -path ./node_modules -prune -o \
              -path ./.git -prune -o \
              -path ./.claude/skills -prune -o \
              -path ./.agents/skills -prune -o \
              -path ./.opencode/skills -prune -o \
              -type f ! -name '*.sh' -print0 |
            while IFS= read -r -d '' f; do
              if head -n1 "$f" 2>/dev/null | grep -qE "^#!.*\\b(bash|sh)\\b"; then
                printf '%s\0' "$f"
              fi
            done
          )
          files=("${sh_files[@]}" "${shebang_files[@]}")
          if [ ${#files[@]} -eq 0 ]; then
            echo "No shell scripts found"
            exit 0
          fi
          printf 'Checking: %s\n' "${files[@]}"
          shellcheck "${files[@]}"

  codex-skill-dir-guard:
    name: no residual CLAUDE_SKILL_DIR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - name: Assert committed codex/opencode skill copies have no ${CLAUDE_SKILL_DIR}
        run: |
          set -euo pipefail
          # 生成コピーを shellcheck/markdownlint/CodeRabbit の対象外にしたため、
          # コミット済み .agents/.opencode skill に ${CLAUDE_SKILL_DIR} が残留しても
          # 他経路では検出されない。patch スクリプトの fail-loud throw は再生成時のみ
          # 効くので、PR CI 側にも残留ガードを置く (PR #153 review)。Codex/OpenCode は
          # 同変数を定義せず、残ると同梱スクリプトのパスが解決できないため。
          if git grep -n -F '${CLAUDE_SKILL_DIR}' -- .agents/skills .opencode/skills; then
            echo '::error::residual ${CLAUDE_SKILL_DIR} in generated codex/opencode skill copies. Regenerate: bun run rulesync:skills:update && bun run rulesync:skills:claude:update'
            exit 1
          fi
          echo 'OK: no residual ${CLAUDE_SKILL_DIR} in .agents/.opencode skill copies'
